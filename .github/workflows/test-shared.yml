name: Test shared

on:
    workflow_dispatch:
    pull_request:
    workflow_call:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: 22
                  cache: 'npm'
            - run: npm ci
            - run: npm run check
            - run: npm run check-versions
            - run: npm test
            - run: npm pack
